apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-maven-app-by-helm
  labels:
    app: java-maven-app-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-maven-app
  template:
    metadata:
      labels:
        app: java-maven-app
    spec:
      containers:
      - name: java-maven-app-ctr
        image: {{ .Values.image }}
        ports:
        - containerPort: 8080